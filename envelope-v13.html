<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eventia Signature · Enveloppe interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent !important;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;color:#9c7438;background:transparent !important}

.wrap{
  width:min(430px,94vw,calc(94vh * 1240/1748));
  background:transparent;position:relative;
  display:flex;flex-direction:column;align-items:center;
}

.scene{
  position:relative;width:100%;aspect-ratio:1240/1748;
  overflow:visible;isolation:isolate;
  touch-action:manipulation;background:transparent;
  margin-bottom:-28%;
}
.scene::before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  left:9%;top:31%;width:82%;height:39%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(72,45,14,.16) 0%,rgba(72,45,14,.10) 38%,rgba(72,45,14,.04) 58%,transparent 78%);
  filter:blur(18px);
}

/* Boite commune toutes images */
.asset{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* z1 - ouverte */
.ouverte{z-index:1;opacity:0;transition:opacity 1.45s cubic-bezier(.22,.61,.36,1)}

/* ─── z2A : HALO 1 — ouverture enveloppe (cercle jaune) ───
   Petit halo concentré à y=44.2%, centré, diffus */
.halo-opening{
  position:absolute;z-index:2;
  /* centré sur la ligne d'ouverture */
  left:25%;top:38%;width:50%;height:14%;
  border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,
    rgba(255,245,180,.72) 0%,
    rgba(255,228,120,.42) 25%,
    rgba(255,210,90,.18) 55%,
    transparent 78%);
  filter:blur(10px);
  transition:opacity 1.2s ease .8s;
}

/* ─── z2B : HALO 2 — éventail derrière les cartes (traits oranges) ───
   Grand halo en cône couvrant la zone 14%→44% en hauteur, 18%→82% en largeur */
.halo-fan{
  position:absolute;z-index:2;
  left:8%;top:8%;width:84%;height:42%;
  pointer-events:none;opacity:0;
  /* Gradient conique : lumière qui irradie depuis le bas vers le haut
     comme une source lumineuse cachée derrière les cartes */
  background:
    radial-gradient(ellipse 70% 80% at 50% 100%,
      rgba(255,240,160,.38) 0%,
      rgba(255,225,120,.20) 35%,
      rgba(255,200,80,.08) 62%,
      transparent 82%);
  filter:blur(14px);
  transition:opacity 1.5s ease 1.0s;
}

/* Canvas particules z3 — AU-DESSUS des halos, SOUS les cartes */
#pCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:3;pointer-events:none;background:transparent;
}

/* z4 - cartes */
.cards{position:absolute;inset:0;z-index:4;pointer-events:none}
.card{
  position:absolute;top:14%;width:27%;height:42%;
  border:0;background:transparent;padding:0;margin:0;
  opacity:0;cursor:pointer;transform-origin:50% 100%;
  pointer-events:none;
  filter:drop-shadow(0 2% 3% rgba(74,50,18,.16));
}
.card-inner{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden}
.card img.bg{width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.cardText{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);text-align:center;padding:0 6%}
.cardIcon{
  display:block;margin:0 auto 7%;
  width:clamp(44px,11.8vw,68px);height:clamp(44px,11.8vw,68px);
  object-fit:contain;filter:drop-shadow(0 3px 7px rgba(180,136,69,.28)) saturate(1.1);
  animation:iconPulse 2.05s ease-in-out infinite;
  will-change:transform,filter;
}
.cardLabel{
  display:block;font-family:'Tenor Sans',sans-serif;
  font-size:clamp(6.6px,2.05vw,10px);letter-spacing:.13em;text-transform:uppercase;
  color:#a27735;line-height:1.34;font-weight:400;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.cardSub{
  display:block;margin-top:5%;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(6.4px,1.95vw,10px);font-style:italic;
  color:rgba(130,96,44,.78);letter-spacing:.03em;line-height:1.22;
}
.cardOrn{position:absolute;top:4%;right:4%;font-size:clamp(8px,2.5vw,14px);color:rgba(193,153,72,.55);pointer-events:none}
.left  {left:18%;transform:translateY(40%) rotate(-8deg)}
.center{left:36.5%;transform:translateY(30%)}
.right {left:55%;transform:translateY(40%) rotate(8deg)}

/* z5 - demi */
.demi{z-index:5;opacity:0;transition:opacity 1.45s cubic-bezier(.22,.61,.36,1)}
/* z6 - fermee */
.fermee{z-index:6;opacity:1;transition:opacity 1.05s ease-out;filter:drop-shadow(0 1.5% 3% rgba(40,22,6,.13))}
/* z7 - cachet */
.seal{
  position:absolute;z-index:7;
  left:50.7%;top:52.9%;width:17.2%;height:auto;
  transform:translate(-50%,-50%);cursor:pointer;
  filter:brightness(1.04) drop-shadow(0 0 1% rgba(192,138,43,.4));
  animation:sealPulse 2.6s ease-in-out infinite;
  user-select:none;-webkit-user-drag:none;
}
.seal.hide{animation:none;opacity:0;transition:opacity .36s ease;pointer-events:none}
/* z9 - etoiles */
.stars{position:absolute;z-index:9;left:50.7%;top:52.9%;width:0;height:0;pointer-events:none}
.star{position:absolute;left:0;top:0;width:clamp(10px,3vw,18px);height:clamp(10px,3vw,18px);opacity:0;transform:translate(-50%,-50%) scale(.12)}
.star:before,.star:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(#fff9d8,#d69d35);box-shadow:0 0 12px rgba(255,230,143,.9)}
.star:before{width:2px;height:100%;border-radius:2px}
.star:after{width:100%;height:2px;border-radius:2px}

/* HINT — rapproché de l'enveloppe, sans vide sous la consigne */
.hint{
  position:absolute;left:0;right:0;top:87%;z-index:20;
  margin:0 auto;border:0;background:transparent;
  color:#a27d3d;font:400 clamp(7.8px,2.1vw,9px)/1 'Tenor Sans',sans-serif;
  letter-spacing:.32em;text-transform:uppercase;
  padding:0;opacity:.54;cursor:pointer;transition:opacity .45s ease;
  white-space:nowrap;text-align:center;display:block;width:100%;
  text-shadow:0 1px 7px rgba(255,250,238,.92);
}

/* États ouverts */
.is-open .fermee{opacity:0}
.is-open .ouverte{opacity:1}
.is-open .demi{opacity:1}
.is-open .halo-opening{opacity:1}
.is-open .halo-fan{opacity:1}
.is-open .cards{pointer-events:auto}
.is-open .card{pointer-events:auto}
.is-open .left  {animation:cardLeft   2.6s  cubic-bezier(.22,.61,.36,1) 1.3s  forwards,floatLeft   6.4s ease-in-out 4.1s  infinite}
.is-open .center{animation:cardCenter 2.75s cubic-bezier(.22,.61,.36,1) 1.5s  forwards,floatCenter 6.2s ease-in-out 4.35s infinite}
.is-open .right {animation:cardRight  2.6s  cubic-bezier(.22,.61,.36,1) 1.7s  forwards,floatRight  6.5s ease-in-out 4.3s  infinite}

/* Halo qui respire en continu après ouverture */
.is-open .halo-opening{animation:haloBreath 3.8s ease-in-out 2s infinite}
.is-open .halo-fan    {animation:fanBreath  4.5s ease-in-out 2.2s infinite}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(15,10,4,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:22px}
.modal.on{display:grid}
.box{position:relative;width:min(360px,90vw);padding:28px 22px;text-align:center;color:#8f682e;background:linear-gradient(168deg,#fffbf3,#f3e8ce);border:1px solid rgba(184,137,62,.42);box-shadow:inset 0 0 0 4px rgba(255,250,240,.85),inset 0 0 0 5px rgba(184,137,62,.16),0 28px 60px rgba(54,34,5,.25);border-radius:22px}
.box h2{margin:0 0 11px;font-size:22px;font-weight:500;color:#b48845;font-style:italic;font-family:'Cormorant Garamond',serif}
.box p{margin:0 0 19px;font-size:15px;line-height:1.5;font-family:'Cormorant Garamond',serif}
.box button,.box label{display:inline-block;border:1px solid rgba(171,126,48,.42);border-radius:999px;background:#fff8e8;color:#8e672f;padding:11px 17px;font-size:13px;cursor:pointer;font-family:'Tenor Sans',sans-serif}
.close{position:absolute;right:14px;top:10px;border:0!important;background:transparent!important;color:#b48845!important;font-size:26px!important;padding:0!important}
.fileInput{position:absolute;opacity:0;width:1px;height:1px}
.weddingFrame{display:none;position:relative;margin:18px auto 0;width:min(250px,74vw);aspect-ratio:2/3;border:1px solid rgba(181,136,64,.42);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#fffaf1,#f3e7cf);box-shadow:0 15px 30px rgba(74,50,18,.12)}
.weddingFrame.on{display:block}
.weddingFrame #preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
.weddingFrame.hasPhoto #preview{display:block}
.cameraFilter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;pointer-events:none}
.frameOverlay{position:absolute;inset:0;z-index:4;box-shadow:inset 0 0 0 1px rgba(180,132,52,.35),inset 0 0 45px rgba(255,244,204,.26);pointer-events:none}
.frameNames,.frameOrn{display:none}
.frameEmpty{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:rgba(146,106,46,.55);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:34px;line-height:1.35;font-family:'Tenor Sans',sans-serif;text-align:center}

.audioRecorder{display:none;margin:18px auto 0;width:min(260px,76vw);padding:16px 14px;border:1px solid rgba(181,136,64,.34);border-radius:18px;background:rgba(255,250,238,.58);box-shadow:inset 0 0 28px rgba(255,238,188,.28)}
.audioRecorder.on{display:block}
.audioStatus{margin:0 0 12px;color:rgba(129,91,38,.72);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-family:'Tenor Sans',sans-serif;line-height:1.45}
.audioStatus.recording::before{content:'● ';color:#b48845;animation:recPulse 1s ease-in-out infinite}
.audioPlayback{display:none;width:100%;height:34px;margin-top:8px}
.audioPlayback.on{display:block}
@keyframes recPulse{0%,100%{opacity:.35}50%{opacity:1}}
.weddingFrame.hasPhoto .frameEmpty{display:none}

/* Keyframes */
@keyframes sealPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);filter:brightness(1) drop-shadow(0 0 1% rgba(192,138,43,.35))}
  50%{transform:translate(-50%,-50%) scale(1.028);filter:brightness(1.13) drop-shadow(0 0 2% rgba(226,181,74,.64))}
}
@keyframes iconPulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 3px 7px rgba(180,136,69,.25)) brightness(1) saturate(1.08)}
  50%{transform:scale(1.105);filter:drop-shadow(0 0 15px rgba(211,160,65,.55)) brightness(1.16) saturate(1.16)}
}
@keyframes starBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0deg)}18%{opacity:1}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1) rotate(70deg)}
}
@keyframes cardLeft  {0%{opacity:0;transform:translateY(40%) rotate(-8deg)}100%{opacity:1;transform:translateY(10%) rotate(-8deg)}}
@keyframes cardCenter{0%{opacity:0;transform:translateY(30%)}100%{opacity:1;transform:translateY(0%)}}
@keyframes cardRight {0%{opacity:0;transform:translateY(40%) rotate(8deg)}100%{opacity:1;transform:translateY(10%) rotate(8deg)}}
@keyframes floatLeft  {0%,100%{transform:translateY(10%) rotate(-8deg)}50%{transform:translateY(8.5%) rotate(-8.4deg)}}
@keyframes floatCenter{0%,100%{transform:translateY(0%)}50%{transform:translateY(-1.4%)}}
@keyframes floatRight {0%,100%{transform:translateY(10%) rotate(8deg)}50%{transform:translateY(8.5%) rotate(8.4deg)}}

/* Halos qui respirent */
@keyframes haloBreath{
  0%,100%{opacity:.75;transform:scale(1)}
  50%{opacity:1;transform:scale(1.08)}
}
@keyframes fanBreath{
  0%,100%{opacity:.7;transform:scale(1)}
  50%{opacity:.95;transform:scale(1.04)}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fermee,.seal{display:none}.ouverte,.halo-opening,.halo-fan,.demi,.card{opacity:1}.left{transform:translateY(10%) rotate(-8deg)}.center{transform:translateY(0%)}.right{transform:translateY(10%) rotate(8deg)}}
</style>
</head>

<script>
(function(){

  /* ═══════════════════════════════════════════════════
     MOTEUR PARTICULES — Canvas 2D
     
     Deux zones d'émission (reflètent les traits oranges) :
     
     ZONE A — Ouverture enveloppe : y=44.2%, x entre 30% et 70%
       → petites particules concentrées, montent droit
     
     ZONE B — Éventail entre les cartes : y entre 14% et 44%
       → émission répartie dans le cône
       → direction vers le haut, angle calé sur l'écart entre cartes
     
     Tout continu (boucle infinie)
  ═══════════════════════════════════════════════════ */

  var canvas  = document.getElementById('pCanvas');
  var ctx     = canvas.getContext('2d');
  var scene   = document.getElementById('scene');
  var pool    = [];
  var running = false;
  var rafId   = null;

  // Ligne d'ouverture (bord sup demi mesuré) = 44.2%
  var OPEN_Y  = 0.442;
  // Éventail : de 14% (haut cartes) à 44.2% (ouverture)
  var FAN_TOP = 0.14;
  // Zone X de l'éventail (entre cartes gauche et droite)
  var FAN_X0  = 0.18, FAN_X1 = 0.82;

  var N = 90; // pool dense

  function syncCanvas(){
    var r = scene.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
    return {w:w, h:h};
  }
  window.addEventListener('resize', syncCanvas);

  /* ── Particule ── */
  function P(w, h, stagger){
    this.init(w, h, stagger);
  }

  P.prototype.init = function(w, h, stagger){
    var zoneA = Math.random() < 0.45; // 45% zone A (ouverture), 55% zone B (éventail)

    if(zoneA){
      // ZONE A : ouverture concentrée, x entre 30% et 70%
      this.x = w * (0.30 + Math.random()*0.40);
      this.y = h * OPEN_Y;
      // Presque vertical, léger spread
      var angle = (-95 + Math.random()*30) * Math.PI/180; // -95° à -65°
      var spd = w * (0.0004 + Math.random()*0.0010);
      this.vx = Math.cos(angle)*spd;
      this.vy = Math.sin(angle)*spd;
      // Très fine
      this.r = w * (0.0008 + Math.random()*0.0018);
    } else {
      // ZONE B : éventail entre les cartes
      // Émission répartie entre x=18% et x=82%, y entre FAN_TOP et OPEN_Y
      this.x = w * (FAN_X0 + Math.random()*(FAN_X1-FAN_X0));
      // Naissance aléatoire dans la zone de l'éventail
      this.y = h * (FAN_TOP + Math.random()*(OPEN_Y - FAN_TOP));

      // Direction : vers le haut, angle calé sur la position X
      // Côté gauche → angle vers le haut-gauche ; centre → droit ; droite → haut-droite
      // (simule le rayonnement en éventail)
      var xRatio = (this.x/w - FAN_X0)/(FAN_X1-FAN_X0); // 0..1 gauche→droite
      var lateralBias = (xRatio - 0.5) * 60; // -30° à +30° de biais latéral
      var angle = (-90 + lateralBias + (Math.random()-0.5)*20) * Math.PI/180;
      var spd = w * (0.0003 + Math.random()*0.0008);
      this.vx = Math.cos(angle)*spd;
      this.vy = Math.sin(angle)*spd;
      // Fine mais légèrement plus visible
      this.r = w * (0.0010 + Math.random()*0.0022);
    }

    this.grav = h * 0.000012; // gravité très légère
    this.frx  = 0.995;

    this.life  = 0;
    this.maxL  = 70 + Math.floor(Math.random()*100);
    this.delay = stagger ? Math.floor(Math.random()*this.maxL) : 0;
    if(stagger) this.life = -this.delay;

    this.alpha = 0;
    this.maxA  = 0.35 + Math.random()*0.55;

    var palettes = [
      [255,236,140],[255,220,95],[255,248,210],
      [240,200,100],[255,255,225],[222,182,82]
    ];
    this.rgb = palettes[Math.floor(Math.random()*palettes.length)];
  };

  P.prototype.update = function(w, h){
    if(this.life < 0){ this.life++; return; }
    this.x  += this.vx;
    this.y  += this.vy;
    this.vy += this.grav;
    this.vx *= this.frx;
    this.life++;

    var t = this.life/this.maxL;
    if(t < 0.12)      this.alpha = (t/0.12)*this.maxA;
    else if(t < 0.72) this.alpha = this.maxA;
    else               this.alpha = this.maxA*(1-(t-0.72)/0.28);

    // Renaissance si morte ou sortie haut
    if(this.life>=this.maxL || this.y < -h*0.04){
      this.init(w, h, false);
    }
  };

  P.prototype.draw = function(ctx){
    if(this.life<0||this.alpha<=0.01) return;
    var c=this.rgb, r=this.r;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.shadowColor = 'rgba('+c[0]+','+c[1]+','+c[2]+',0.75)';
    ctx.shadowBlur  = r*5;
    // Point lumineux
    ctx.fillStyle = 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI*2);
    ctx.fill();
    // Trait vertical fin (étincelle)
    ctx.strokeStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+',0.5)';
    ctx.lineWidth = Math.max(0.3, r*0.4);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y+r*1.8);
    ctx.lineTo(this.x, this.y-r*4.0);
    ctx.stroke();
    ctx.restore();
  };

  function initPool(){
    pool=[];
    var d=syncCanvas();
    for(var i=0;i<N;i++) pool.push(new P(d.w,d.h,true));
  }

  function tick(){
    var d=syncCanvas();
    var w=d.w, h=d.h;
    ctx.clearRect(0,0,w,h);

    // Ligne lumineuse subtile à l'ouverture (y=44.2%)
    var ey = h*OPEN_Y;
    var g = ctx.createLinearGradient(w*0.22,ey,w*0.78,ey);
    g.addColorStop(0,  'rgba(255,236,140,0)');
    g.addColorStop(0.2,'rgba(255,236,140,0.12)');
    g.addColorStop(0.5,'rgba(255,220,100,0.24)');
    g.addColorStop(0.8,'rgba(255,236,140,0.12)');
    g.addColorStop(1,  'rgba(255,236,140,0)');
    ctx.save();
    ctx.strokeStyle=g;
    ctx.lineWidth=Math.max(0.5,w*0.0018);
    ctx.shadowColor='rgba(255,230,120,.28)';
    ctx.shadowBlur=w*0.01;
    ctx.beginPath();ctx.moveTo(w*0.22,ey);ctx.lineTo(w*0.78,ey);ctx.stroke();
    ctx.restore();

    for(var i=0;i<pool.length;i++){
      pool[i].update(w,h);
      pool[i].draw(ctx);
    }
    if(running) rafId=requestAnimationFrame(tick);
  }

  function startParticles(){
    if(running)return;
    running=true; initPool();
    rafId=requestAnimationFrame(tick);
  }
  function stopParticles(){
    running=false;
    if(rafId) cancelAnimationFrame(rafId);
    var d=syncCanvas();
    ctx.clearRect(0,0,d.w,d.h);
  }

  /* ═══════════════════════════════════════════════════
     INTERACTIONS
  ═══════════════════════════════════════════════════ */
  var seal  = document.getElementById('seal');
  var hint  = document.getElementById('hint');
  var stars = document.getElementById('stars');
  var opened= false;

  function makeStars(){
    stars.innerHTML='';
    var r=scene.getBoundingClientRect();
    var rad=r.width*0.14;
    [0,30,60,90,120,150,180,210,240,270,300,330].forEach(function(deg,i){
      var a=deg*Math.PI/180;
      var s=document.createElement('i');
      s.className='star';
      s.style.setProperty('--sx',(Math.cos(a)*rad)+'px');
      s.style.setProperty('--sy',(Math.sin(a)*rad)+'px');
      s.style.animation='starBurst .9s ease-out '+(i*.03)+'s forwards';
      stars.appendChild(s);
    });
    setTimeout(function(){stars.innerHTML='';},1500);
  }

  function openIt(){
    if(opened)return;
    opened=true;
    makeStars();
    seal.classList.add('hide');
    hint.style.opacity='0';
    scene.classList.add('is-open');
    // Particules démarrent à l'ouverture et tournent en continu
    setTimeout(startParticles,850);
    setTimeout(function(){
      hint.textContent='TOUCHEZ CHAQUE CARTE';
      hint.style.opacity='.48';
    },3800);
  }

  seal.addEventListener('click',openIt);
  hint.addEventListener('click',function(){
    if(!opened)openIt();
    else{ stopParticles(); location.reload(); }
  });

  /* ═══════════════════════════════════════════════════
     MODAL
  ═══════════════════════════════════════════════════ */
  var modal   =document.getElementById('modal'),
      title   =document.getElementById('mTitle'),
      text    =document.getElementById('mText'),
      action  =document.getElementById('mAction'),
      label   =document.getElementById('fileLabel'),
      fileText=document.getElementById('fileText'),
      input   =document.getElementById('fileInput'),
      frame   =document.getElementById('weddingFrame'),
      preview =document.getElementById('preview'),
      audioBox=document.getElementById('audioRecorder'),
      audioStatus=document.getElementById('audioStatus'),
      audioPlayback=document.getElementById('audioPlayback');

  var mediaRecorder=null,audioChunks=[],audioStream=null,audioURL=null;

  function stopAudioStream(){
    if(mediaRecorder&&mediaRecorder.state==='recording'){try{mediaRecorder.stop();}catch(e){}}
    if(audioStream){audioStream.getTracks().forEach(function(t){t.stop();});audioStream=null;}
  }

  function resetModal(){
    stopAudioStream();
    action.style.display='inline-block';label.style.display='none';audioBox.classList.remove('on');
    audioStatus.classList.remove('recording');audioStatus.textContent='Micro prêt';
    audioPlayback.classList.remove('on');audioPlayback.removeAttribute('src');
    if(audioURL){URL.revokeObjectURL(audioURL);audioURL=null;}
    frame.classList.remove('on','hasPhoto');action.onclick=null;input.onchange=null;
    input.removeAttribute('capture');input.value='';
  }
  var content={
    album:['La Galerie des Instants','Partagez vos plus beaux clichés et contribuez à l’album souvenir des mariés.','Ouvrir l’appareil photo'],
    audio:['Les Échos du Cœur','Un mot, un souvenir ou une pensée sincère à conserver au fil des années.','Enregistrer un message'],
    music:['La Bande-Son de Marie-Paul & Yann','Ajoutez une chanson qui vous inspire ou qui vous fera danser.','Ouvrir Spotify']
  };

  function openAlbum(){
    input.accept='image/*';
    input.setAttribute('capture','environment');
    input.onchange=function(){
      var f=input.files&&input.files[0];
      if(!f)return;
      resetModal();
      title.textContent=content.album[0];
      text.textContent='Votre photo est prête à rejoindre l’album souvenir.';
      action.style.display='none';
      frame.classList.add('on','hasPhoto');
      preview.src=URL.createObjectURL(f);
      modal.classList.add('on');
    };
    input.click();
  }

  function openAudio(){
    resetModal();
    title.textContent=content.audio[0];
    text.textContent='Enregistrez votre message directement ici. Safari demandera l’autorisation du micro.';
    action.textContent='🎙 Démarrer';
    audioBox.classList.add('on');
    modal.classList.add('on');
    action.onclick=startAudioRecording;
  }

  function startAudioRecording(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
      fallbackAudioInput();
      return;
    }
    audioStatus.textContent='Demande d’autorisation du micro';
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      audioStream=stream;audioChunks=[];
      mediaRecorder=new MediaRecorder(stream);
      mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data);};
      mediaRecorder.onstop=function(){
        var blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
        audioURL=URL.createObjectURL(blob);
        audioPlayback.src=audioURL;
        audioPlayback.classList.add('on');
        audioStatus.classList.remove('recording');
        audioStatus.textContent='Message vocal prêt à écouter';
        text.textContent='Votre message vocal est prêt à être conservé.';
        action.textContent='🎙 Réenregistrer';
        action.onclick=startAudioRecording;
        if(audioStream){audioStream.getTracks().forEach(function(t){t.stop();});audioStream=null;}
      };
      mediaRecorder.start();
      audioStatus.classList.add('recording');
      audioStatus.textContent='Enregistrement en cours';
      text.textContent='Parlez maintenant, puis arrêtez quand votre message est terminé.';
      action.textContent='Arrêter';
      action.onclick=function(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();};
    }).catch(function(){
      fallbackAudioInput();
    });
  }

  function fallbackAudioInput(){
    input.accept='audio/*';
    input.removeAttribute('capture');
    input.onchange=function(){
      var f=input.files&&input.files[0];
      title.textContent=content.audio[0];
      text.textContent=f ? 'Votre message vocal est prêt à être conservé.' : content.audio[1];
      action.style.display='none';
      audioBox.classList.add('on');
      audioStatus.classList.remove('recording');
      audioStatus.textContent=f ? 'Fichier audio sélectionné' : 'Aucun message sélectionné';
      if(f){
        audioURL=URL.createObjectURL(f);
        audioPlayback.src=audioURL;
        audioPlayback.classList.add('on');
      }
      modal.classList.add('on');
    };
    input.click();
  }

  function openMusic(){
    window.open('https://open.spotify.com/search/La%20Bande-Son%20de%20Marie-Paul%20%26%20Yann','_blank');
  }

  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click',function(){
      var type=card.dataset.card;
      if(type==='album') openAlbum();
      if(type==='audio') openAudio();
      if(type==='music') openMusic();
      hint.textContent='↺ REJOUER';hint.style.opacity='.4';
    });
  });

  document.getElementById('close').onclick=function(){modal.classList.remove('on');stopAudioStream();};
  modal.addEventListener('click',function(e){if(e.target===modal){modal.classList.remove('on');stopAudioStream();}});

})();
</script>
</body>
</html>
